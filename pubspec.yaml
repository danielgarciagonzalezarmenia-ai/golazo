name: golazo
description: "Aprende fútbol jugando. Una racha a la vez."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  intl: any
  shared_preferences: ^2.3.3
  path_provider: ^2.1.1
  flutter_local_notifications: ^18.0.0
  timezone: ^0.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.0

flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  ios: true
  remove_alpha_ios: true
  android: true
  adaptive_icon_background: "#0E7A3A"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 24

flutter:
  uses-material-design: true

  assets:
    - assets/content/
    - assets/icon/
